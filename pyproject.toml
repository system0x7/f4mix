[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f4mix"
version = "0.2.0"
description = "Fast and reliable sample-wise reference fitting using covariance-aware f4 profiles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["f4mix*"]
